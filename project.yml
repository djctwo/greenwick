name: Greenwick
options:
  bundleIdPrefix: com.greenwick
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Unsigned/ad-hoc by default so anyone can build. Add your own team to sign.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    # GRDB 7.11.1, pinned to its commit (a tag can be moved; no Package.resolved is
    # committed because the Xcode project is generated). Update both together.
    revision: b83108d10f42680d78f23fe4d4d80fc88dab3212

targets:
  Greenwick:
    type: application
    platform: macOS
    sources:
      - path: StockJournal
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        # Release bundle ID. For local test runs pass a throwaway ID on the command line,
        # e.g. GREENWICK_BUNDLE_ID=com.greenwick.app.test (see CLAUDE.md). The app then
        # uses its own data folder and Keychain entries.
        GREENWICK_BUNDLE_ID: com.greenwick.app
        PRODUCT_BUNDLE_IDENTIFIER: $(GREENWICK_BUNDLE_ID)
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_CFBundleDisplayName: "Greenwick"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Douglas Cleary. Licensed under the GNU GPL v3."
        CODE_SIGN_ENTITLEMENTS: StockJournal/Greenwick.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        STRIP_INSTALLED_PRODUCT: YES
        COPY_PHASE_STRIP: YES
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ATSApplicationFontsPath: Fonts
      configs:
        Release:
          # No com.apple.security.get-task-allow in release builds (no debugger attach)
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: GRDB

  GreenwickTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GreenwickTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greenwick.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Greenwick

  GreenwickUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: GreenwickUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greenwick.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        TEST_TARGET_NAME: Greenwick
    dependencies:
      - target: Greenwick

schemes:
  Greenwick:
    build:
      targets:
        Greenwick: all
        GreenwickTests: [test]
        GreenwickUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GreenwickTests
        - GreenwickUITests
    archive:
      config: Release
  GreenwickUnitTests:
    build:
      targets:
        Greenwick: all
        GreenwickTests: [test]
    test:
      config: Debug
      targets:
        - GreenwickTests
